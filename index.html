<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0e1512"/>
<title>Rolê com Marco</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  :root{
    --bg:#0e1512; --panel:#15201b; --panel2:#1c2b23; --line:#2a3a30;
    --txt:#eaf3ee; --mut:#9fb3a8; --accent:#7ed957; --accent-d:#0e1512; --chk:#1D9E75; --user:#2b8cff;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;}
  .wrap{width:100%;max-width:900px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    padding-left:var(--sal);padding-right:var(--sar);}
  header{padding:calc(14px + var(--sat)) 18px 12px;position:sticky;top:0;
    background:linear-gradient(180deg,var(--bg) 60%,rgba(14,21,18,.92));z-index:600;backdrop-filter:blur(6px);}
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{width:46px;height:46px;border-radius:13px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent-d);font-size:25px;flex:none;}
  .brand h1{font-size:clamp(20px,5.5vw,26px);margin:0;font-weight:700;line-height:1.05;}
  .brand p{margin:2px 0 0;font-size:13px;color:var(--mut);}
  .search{margin-top:14px;position:relative;}
  .search input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--txt);padding:0 44px 0 46px;font-size:17px;outline:none;}
  .search input:focus{border-color:var(--accent);}
  .search .mag{position:absolute;left:15px;top:15px;color:var(--mut);font-size:20px;font-style:normal;}
  .search .clr{position:absolute;right:12px;top:11px;width:30px;height:30px;border:none;background:var(--panel2);color:var(--txt);border-radius:8px;font-size:16px;cursor:pointer;display:none;}

  /* ---- mapa ---- */
  #mapwrap{position:relative;margin:12px 0 0;}
  #map{height:clamp(320px,48dvh,600px);width:100%;background:#0b120f;z-index:1;}
  #mapHint{position:absolute;left:14px;bottom:14px;z-index:400;background:rgba(14,21,18,.82);border:1px solid var(--line);
    color:var(--txt);font-size:13px;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:6px;pointer-events:none;}
  .mapbtn{position:absolute;z-index:400;width:50px;height:50px;border-radius:13px;background:rgba(14,21,18,.85);
    border:1px solid var(--line);color:var(--txt);font-size:23px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #expandBtn{right:14px;top:14px;}
  #locateBtn{left:14px;top:14px;}
  #mapwrap.full{position:fixed;inset:0;margin:0;z-index:9999;}
  #mapwrap.full #map{height:100dvh;height:100vh;border-radius:0;}
  #closeBtn{display:none;right:14px;top:calc(14px + var(--sat));width:54px;height:54px;font-size:26px;}
  #gmapsArea{display:none;position:absolute;left:14px;right:14px;bottom:calc(16px + var(--sab));z-index:500;
    height:56px;border-radius:15px;background:var(--accent);color:var(--accent-d);border:none;font-size:16px;font-weight:800;cursor:pointer;align-items:center;justify-content:center;gap:8px;}
  #mapwrap.full #closeBtn,#mapwrap.full #gmapsArea{display:flex;}
  #mapwrap.full #expandBtn,#mapwrap.full #mapHint{display:none;}
  #mapwrap.full #locateBtn{top:calc(14px + var(--sat));}

  /* ---- painel de informações (fixo abaixo do mapa) ---- */
  .stats{display:flex;gap:9px;padding:12px 18px 4px;}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;}
  .stat b{display:block;font-size:24px;line-height:1;}
  .stat span{font-size:12px;color:var(--mut);}
  .prog{margin:8px 18px 0;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:10px;}
  .bar{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s;}

  /* ---- banners (home) ---- */
  .sect{font-size:14px;color:var(--mut);margin:16px 18px 10px;text-transform:uppercase;letter-spacing:.05em;}
  .banner-all{margin:8px 18px 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(120deg,#12351f,#0e1512);cursor:pointer;padding:20px;display:flex;align-items:center;justify-content:space-between;}
  .banner-all .t{font-size:21px;font-weight:800;}
  .banner-all .s{font-size:13px;color:var(--mut);margin-top:3px;}
  .banner-all .go{font-size:30px;color:var(--accent);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:10px 18px calc(34px + var(--sab));}
  .ban{position:relative;border-radius:18px;overflow:hidden;cursor:pointer;min-height:108px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);}
  .ban .glow{position:absolute;inset:0;opacity:.20;}
  .ban .nm{position:relative;font-size:17px;font-weight:700;line-height:1.15;}
  .ban .ct{position:relative;font-size:12px;color:var(--mut);margin-top:3px;}
  .ban .ic{position:absolute;top:12px;right:14px;font-size:26px;opacity:.95;}

  /* ---- categoria ---- */
  .catbar{display:flex;align-items:center;gap:12px;padding:14px 18px 4px;}
  .back{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
  .catbar h2{font-size:22px;margin:0;font-weight:800;flex:1;line-height:1.1;}
  .catbar .cnt{font-size:13px;color:var(--mut);}
  .chips{display:flex;gap:9px;overflow-x:auto;padding:10px 18px 4px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{white-space:nowrap;font-size:15px;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;}
  .chip.on{background:var(--accent);color:var(--accent-d);border-color:var(--accent);font-weight:700;}
  .list{padding:12px 18px calc(40px + var(--sab));display:flex;flex-direction:column;gap:12px;}
  .grp{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 2px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;}
  .top{display:flex;align-items:center;gap:14px;}
  .chk{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;padding:0;}
  .chk.on{background:var(--chk);border-color:var(--chk);}
  .info{flex:1;min-width:0;}
  .info .nm{font-size:18px;font-weight:700;line-height:1.15;}
  .info .nm.done{text-decoration:line-through;opacity:.55;}
  .meta{display:flex;gap:9px;align-items:center;margin-top:5px;flex-wrap:wrap;font-size:13px;}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .metro{color:var(--accent);}
  .metro.no{color:var(--mut);}
  .acts{display:flex;gap:10px;margin-top:14px;}
  .btn{flex:1;height:50px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
    font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;}
  .btn.dir{background:var(--accent);color:var(--accent-d);border-color:var(--accent);}
  .btn i{font-style:normal;font-size:19px;}
  .empty{text-align:center;color:var(--mut);padding:30px 18px;font-size:15px;}
  .foot{color:var(--mut);font-size:12px;text-align:center;padding:0 18px calc(26px + var(--sab));}
  .leaflet-popup-content{font-size:14px;line-height:1.45;}
  .leaflet-popup-content a{color:#0a66c2;font-weight:700;text-decoration:none;}
  .hidden{display:none !important;}
  body.noscroll{overflow:hidden;}
</style>
</head>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🌵</div>
      <div><h1>Rolê com Marco</h1><p>Restaurantes pra visitar em São Paulo</p></div>
    </div>
    <div class="search">
      <i class="mag">🔎</i>

      <button class="clr" id="clr" aria-label="Limpar busca">✕</button>
    </div>
  </header>

  <div id="mapwrap">
    <div id="map"></div>
    <button id="locateBtn" class="mapbtn" aria-label="Minha localização">📍</button>
    <button id="expandBtn" class="mapbtn" aria-label="Abrir mapa em tela cheia">⛶</button>
    <div id="mapHint">👆 toque no mapa para tela cheia</div>
    <button id="closeBtn" class="mapbtn" aria-label="Fechar tela cheia">✕</button>
    <button id="gmapsArea"><i>🧭</i> Abrir esta área no Google Maps</button>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><b id="sFui">0</b><span>visitados</span></div>
    <div class="stat"><b id="sFalta">0</b><span>faltam</span></div>
    <div class="stat"><b id="sMetro">0</b><span>no metrô</span></div>
    <div class="stat"><b id="sTot">0</b><span>total</span></div>
  </div>

  <div class="prog" id="prog" style="display:none">
    <span id="progTxt">Localizando…</span>
    <span class="bar"><i id="progBar"></i></span>
  </div>

  <section id="home">
    <div class="banner-all" id="banAll">
      <div><div class="t">🗺️ Todas as lojas</div><div class="s" id="allSub">Ver todos os restaurantes no mapa</div></div>
      <div class="go">›</div>
    </div>
    <div class="sect">Categorias</div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="cat" class="hidden">
    <div class="catbar">
      <button class="back" id="back" aria-label="Voltar">‹</button>
      <h2 id="catTitle">Categoria</h2>
      <span class="cnt" id="catCount"></span>
    </div>
    <div class="chips" id="statusChips">
      <button class="chip on" data-st="todos">Todos</button>
      <button class="chip" data-st="metro">🚇 Perto do metrô</button>
      <button class="chip" data-st="faltam">A visitar</button>
      <button class="chip" data-st="fui">✓ Já fui</button>
    </div>
    <div class="list" id="list"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

function enterFull(focus){
 isFull=true;mapwrap.classList.add("full");document.body.classList.add("noscroll");
 map.dragging.enable();map.scrollWheelZoom.enable();map.doubleClickZoom.enable();map.touchZoom.enable();
 setTimeout(()=>{map.invalidateSize();if(focus){map.setView(focus,16);}},60);
}
function exitFull(){
 isFull=false;mapwrap.classList.remove("full");document.body.classList.remove("noscroll");
 map.dragging.disable();map.scrollWheelZoom.disable();map.doubleClickZoom.disable();
 setTimeout(()=>{map.invalidateSize();},60);

   if(!isFull)enterFull(ll);else map.setView(ll,16);

 ["Chácara Klabin",-23.5875,-46.6249],["Liberdade",-23.5588,-46.6349],["Vergueiro",-23.5722,-46.6396],
 ["Pedro II",-23.5479,-46.6274],["Palmeiras-Barra Funda",-23.5266,-46.6659]
].map(s=>({name:s[0],lat:s[1],lng:s[2]}));
if(!STATIONS.length) STATIONS=ST_FALLBACK.slice();

function haversine(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180;
 const dLat=t(c-a),dLng=t(d-b);const s=Math.sin(dLat/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLng/2)**2;
 return 2*R*Math.asin(Math.sqrt(s));}
function nearestStation(lat,lng){let best=null,bd=1e12;STATIONS.forEach(s=>{const dd=haversine(lat,lng,s.lat,s.lng);if(dd<bd){bd=dd;best=s;}});return best?{name:best.name,dist:Math.round(bd)}:null;}
const METRO_M=1000;
function metroNear(it){const p=GEO[it.nome];if(!p)return false;const n=nearestStation(p[0],p[1]);return n&&n.dist<=METRO_M;}
function gmapsDir(it){const p=GEO[it.nome];const dest=p?p[0]+","+p[1]:encodeURIComponent(it.nome+" São Paulo");
 const o=USERLOC?"&origin="+USERLOC[0]+","+USERLOC[1]:"";return "https://www.google.com/maps/dir/?api=1&destination="+dest+o;}

function mapItems(){
 if(view==="cat"){if(catF==="__todas__")return ITEMS;return catItems(catF);}
 return ITEMS;
}
function drawMap(){
 layer.clearLayers();const its=mapItems();const pts=[];
 its.forEach(it=>{const p=GEO[it.nome];if(!p)return;
   const near=metroNear(it);const ns=nearestStation(p[0],p[1]);
   const m=L.circleMarker(p,{radius:9,color:"#0e1512",weight:2,fillColor:CATS[it.cat]||"#999",fillOpacity:1})
     .bindPopup("<b>"+it.nome+"</b><br>"+it.cat+(near?"<br>🚇 "+ns.name+" · "+ns.dist+"m":"")+
       '<br><a href="'+gmapsDir(it)+'" target="_blank" rel="noopener">➤ Como chegar</a>');
   m.addTo(layer);markers[it.nome]=m;pts.push(p);});
 if(view==="cat"&&pts.length&&!isFull){map.fitBounds(pts,{padding:[40,40],maxZoom:15});}
}

function drawStats(){
 let nFui=0,nMetro=0;ITEMS.forEach(it=>{if(VIS[it.nome])nFui++;if(metroNear(it))nMetro++;});
 sFui.textContent=nFui;sFalta.textContent=ITEMS.length-nFui;sMetro.textContent=nMetro;sTot.textContent=ITEMS.length;
 allSub.textContent=ITEMS.length+" restaurantes · "+nFui+" já visitados";
}
function drawGrid(){
 const g=document.getElementById("grid");g.innerHTML="";
 Object.keys(CATS).forEach(c=>{const n=catItems(c).length;if(!n)return;
   const b=document.createElement("div");b.className="ban";b.style.background=hexA(CATS[c],.10);b.style.borderColor=hexA(CATS[c],.35);
   b.innerHTML='<div class="glow" style="background:'+CATS[c]+'"></div><div class="ic">'+(ICONS[c]||"🍴")+'</div>'+
     '<div class="nm">'+c+'</div><div class="ct">'+n+' '+(n>1?'lugares':'lugar')+'</div>';
   b.onclick=()=>openCat(c);g.appendChild(b);});
}
function hexA(hex,a){const h=hex.replace("#","");const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return "rgba("+r+","+g+","+b+","+a+")";}

function openCat(c){
 view="cat";catF=c;statusF="todos";
 document.getElementById("home").classList.add("hidden");
 document.getElementById("cat").classList.remove("hidden");
 document.getElementById("catTitle").textContent = c==="__todas__" ? "🗺️ Todas as lojas" : ((ICONS[c]||"")+" "+c);
 document.querySelectorAll("#statusChips .chip").forEach(x=>x.classList.toggle("on",x.dataset.st==="todos"));
 drawMap();renderList();
}
function goHome(){
 view="home";catF=null;
 document.getElementById("cat").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
 drawStats();drawGrid();drawMap();
}
document.getElementById("back").onclick=goHome;
document.getElementById("banAll").onclick=()=>openCat("__todas__");

function passStatus(it){
 if(statusF==="metro")return metroNear(it);
 if(statusF==="fui")return !!VIS[it.nome];
 if(statusF==="faltam")return !VIS[it.nome];
 return true;
}
function renderList(){
 const base = catF==="__todas__" ? ITEMS : catItems(catF);
 const q=query.trim().toLowerCase();
 const shown=base.filter(it=>{if(q&&!it.nome.toLowerCase().includes(q))return false;return passStatus(it);});
 document.getElementById("catCount").textContent=shown.length+"/"+base.length;
 const list=document.getElementById("list");list.innerHTML="";
 if(!shown.length){list.innerHTML='<div class="empty">Nada por aqui com esse filtro.</div>';drawMap();return;}
 let curCat="";
 shown.forEach(it=>{
   if(catF==="__todas__"&&it.cat!==curCat){curCat=it.cat;const gg=document.createElement("div");gg.className="grp";gg.textContent=curCat;list.appendChild(gg);}
   const p=GEO[it.nome];const done=!!VIS[it.nome];const near=metroNear(it);const ns=p?nearestStation(p[0],p[1]):null;
   const card=document.createElement("div");card.className="card";
   const top=document.createElement("div");top.className="top";
   const chk=document.createElement("button");chk.className="chk"+(done?" on":"");chk.innerHTML=done?"✓":"";
   chk.setAttribute("aria-label",done?"Desmarcar":"Marcar como visitado");
   chk.onclick=()=>{if(VIS[it.nome])delete VIS[it.nome];else VIS[it.nome]=1;save(LS_VIS,VIS);drawStats();renderList();};
   const info=document.createElement("div");info.className="info";
   info.innerHTML='<div class="nm'+(done?' done':'')+'">'+it.nome+'</div>'+
     '<div class="meta"><span class="dot" style="background:'+(CATS[it.cat]||'#999')+'"></span>'+
     '<span style="color:var(--mut)">'+it.cat+'</span>'+
     (p?('<span class="metro'+(near?'':' no')+'">🚇 '+(ns?ns.name+' · '+ns.dist+'m':'—')+'</span>'):'<span class="metro no">📍 localizando…</span>')+'</div>';
   top.appendChild(chk);top.appendChild(info);
   const acts=document.createElement("div");acts.className="acts";
   const bMap=document.createElement("button");bMap.className="btn";bMap.innerHTML='<i>◎</i> Ver no mapa';
   bMap.onclick=()=>{if(!p){alert("Ainda localizando este lugar. Tente em instantes.");return;}enterFull(p);setTimeout(()=>{if(markers[it.nome])markers[it.nome].openPopup();},250);};
   const bDir=document.createElement("a");bDir.className="btn dir";bDir.href=gmapsDir(it);bDir.target="_blank";bDir.rel="noopener";bDir.innerHTML='<i>➤</i> Direções';
   acts.appendChild(bMap);acts.appendChild(bDir);
   card.appendChild(top);card.appendChild(acts);list.appendChild(card);
 });
 drawMap();
}

document.querySelectorAll("#statusChips .chip").forEach(b=>{b.onclick=()=>{statusF=b.dataset.st;
 document.querySelectorAll("#statusChips .chip").forEach(x=>x.classList.toggle("on",x===b));renderList();};});
const qEl=document.getElementById("q");
qEl.addEventListener("input",e=>{
 query=e.target.value;
 document.getElementById("clr").style.display=query?"block":"none";
 if(query.trim()&&view==="home"){openCat("__todas__");}
 if(view==="cat")renderList();
});
document.getElementById("clr").onclick=()=>{query="";qEl.value="";document.getElementById("clr").style.display="none";if(view==="cat")renderList();};

async function fetchStations(){
 try{
  const q='[out:json][timeout:60];(node["station"="subway"](-24.05,-46.85,-23.35,-46.36);node["railway"="station"]["network"~"CPTM|Metr",i](-24.05,-46.85,-23.35,-46.36););out;';
  const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)});
  const j=await r.json();const arr=[];
  j.elements.forEach(e=>{if(e.lat&&e.tags&&e.tags.name)arr.push({name:e.tags.name,lat:e.lat,lng:e.lon});});
  if(arr.length>20){STATIONS=arr;save(LS_ST,STATIONS);}
 }catch(e){}
}
const SP={vb:"-46.83,-24.02,-46.36,-23.36"};
async function geocodeOne(nome){
 const url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&viewbox="+SP.vb+"&bounded=1&q="+encodeURIComponent(nome+", São Paulo, SP");
 try{const r=await fetch(url,{headers:{"Accept-Language":"pt-BR"}});const j=await r.json();
   if(j&&j[0])return [parseFloat(j[0].lat),parseFloat(j[0].lon)];}catch(e){}
 return null;
}
async function geocodeAll(){
 const prog=document.getElementById("prog"),bar=document.getElementById("progBar"),txt=document.getElementById("progTxt");
 const todo=ITEMS.filter(it=>!GEO[it.nome]);
 if(!todo.length){document.getElementById("foot").textContent="Todos localizados · "+ITEMS.length+" restaurantes.";return;}
 prog.style.display="flex";let done=0;const falhas=[];
 for(const it of todo){
   txt.textContent="Localizando "+it.nome+"…";
   const p=await geocodeOne(it.nome);
   if(p){GEO[it.nome]=p;save(LS_GEO,GEO);} else falhas.push(it.nome);
   done++;bar.style.width=Math.round(done/todo.length*100)+"%";
   if(done%5===0){drawStats();drawMap();if(view==="cat")renderList();}
   await new Promise(r=>setTimeout(r,1100));
 }
 drawStats();drawMap();if(view==="cat")renderList();prog.style.display="none";
 document.getElementById("foot").innerHTML=(ITEMS.length-falhas.length)+" de "+ITEMS.length+" localizados."+
   (falhas.length?"<br>Não encontrados: "+falhas.join(", "):"");
}

for(const nm in SEED){if(!GEO[nm])GEO[nm]=SEED[nm];}
goHome();
setTimeout(()=>map.invalidateSize(),300);
(async()=>{if(STATIONS.length<=ST_FALLBACK.length)await fetchStations();drawStats();drawMap();geocodeAll();})();
</script>
